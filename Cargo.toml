[package]
name = "mdbase-lsp"
version = "0.3.0-rc.2"
edition = "2021"
description = "Language Server Protocol server for mdbase collections"
license = "MIT"
repository = "https://github.com/callumalpass/mdbase-lsp"
homepage = "https://github.com/callumalpass/mdbase-lsp"
include = [
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/conformance/**",
    "/src/**",
]

[dependencies]
mdbase = { path = "../mdbase-rs", version = "=0.4.0-rc.2" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dashmap = "6"
ropey = "1"
chrono = "0.4"
ulid = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
