name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: mdbase-lsp

    steps:
      - name: Checkout mdbase-lsp
        uses: actions/checkout@v5
        with:
          path: mdbase-lsp

      - name: Checkout mdbase-rs
        uses: actions/checkout@v5
        with:
          repository: callumalpass/mdbase-rs
          ref: a94c364f71cd126723baaf6d027649f0144dd182
          path: mdbase-rs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo check
        run: cargo check

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build extension
        working-directory: mdbase-lsp/editors/vscode
        run: |
          npm ci
          npm audit --audit-level=high
          npm run compile
